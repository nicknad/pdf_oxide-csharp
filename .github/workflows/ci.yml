name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"

      - name: Build native library
        run: cargo build --release --locked --manifest-path rust/Cargo.toml

      - name: Copy native library into runtimes
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp rust/target/release/pdfoxide_bindings.dll \
              runtimes/win-x64/native/pdfoxide_bindings.dll
          else
            cp rust/target/release/libpdfoxide_bindings.so \
              runtimes/linux-x64/native/libpdfoxide_bindings.so
          fi

      - name: Build and run the native ABI driver
        if: runner.os == 'Linux'
        run: |
          cc -std=c11 -Wall -Wextra -Werror tools/ffi-abi-driver/ffi_abi_driver.c -o ffi_abi_driver -ldl
          ./ffi_abi_driver runtimes/linux-x64/native/libpdfoxide_bindings.so symbols
          ./ffi_abi_driver runtimes/linux-x64/native/libpdfoxide_bindings.so smoke

      - name: Restore
        run: dotnet restore csharp/PdfOxideTests/PdfOxideTests.csproj

      - name: Build
        run: dotnet build csharp/PdfOxideTests/PdfOxideTests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test csharp/PdfOxideTests/PdfOxideTests.csproj --configuration Release --no-build

  rust:
    name: Check and test Rust native library
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            rust/fuzz

      - name: Cargo check
        run: cargo check --locked --manifest-path rust/Cargo.toml

      - name: Cargo test
        run: cargo test --locked --manifest-path rust/Cargo.toml

      - name: Cargo check fuzz targets
        run: cargo check --manifest-path rust/fuzz/Cargo.toml

  pack:
    name: Pack NuGet package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"

      - name: Build native library
        run: cargo build --release --locked --manifest-path rust/Cargo.toml

      - name: Copy native library into runtimes
        shell: bash
        run: |
          cp rust/target/release/libpdfoxide_bindings.so \
            runtimes/linux-x64/native/libpdfoxide_bindings.so

      - name: Restore
        run: dotnet restore csharp/PdfOxideBindings/PdfOxideBindings.csproj

      - name: Build
        run: dotnet build csharp/PdfOxideBindings/PdfOxideBindings.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack csharp/PdfOxideBindings/PdfOxideBindings.csproj --configuration Release

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: csharp/PdfOxideBindings/bin/Release/*.nupkg
