name: Sanitizers

on:
  schedule:
    # Nightly at 04:00 UTC.
    - cron: "0 4 * * *"
  workflow_dispatch:
  # A scheduled workflow only ever runs the default branch, so a change to this
  # file could not be exercised until after it merged - which is how the
  # 2026-11-06..09 failures went unnoticed against an untested "fix". Pushes to
  # gate-work branches get the same feedback loop before merge without adding
  # cost to every pull request.
  push:
    branches: ["ci/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan:
    name: ASAN ABI driver
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # `-Zbuild-std` needs the standard library sources.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: sanitizers-asan

      # Sanitizer flags belong in `target.<triple>.rustflags`, never in
      # `RUSTFLAGS`: the latter also reaches host units (build scripts and
      # proc-macro crates), which is what produced
      # "building proc macro crate with sanitizers enabled is not supported"
      # (bytemuck_derive) and the `unicode_ident` ABI-mismatch error.
      # An explicit `--target` is what makes cargo treat build scripts as host
      # units in the first place. `-Zbuild-std` instruments std as well, so the
      # whole target-side dependency graph shares one sanitizer configuration.
      - name: Build instrumented native library
        env:
          CARGO_TARGET_DIR: rust/target/asan
        run: >
          cargo +nightly build --manifest-path rust/Cargo.toml
          --target x86_64-unknown-linux-gnu
          -Zbuild-std
          --config "target.x86_64-unknown-linux-gnu.rustflags=['-Zsanitizer=address']"

      # Exit status alone cannot tell an instrumented build from an
      # uninstrumented one: a job that quietly drops the flags would still pass
      # every scenario below. Assert on the artifact instead.
      - name: Verify the library is ASAN-instrumented
        run: |
          set -euo pipefail
          so=rust/target/asan/x86_64-unknown-linux-gnu/debug/libpdfoxide_bindings.so
          test -f "$so"
          if ! readelf -d "$so" | grep -qE 'NEEDED.*libasan'; then
            echo "::error::$so does not link the ASAN runtime"
            readelf -d "$so"
            exit 1
          fi
          if ! nm -D "$so" | grep -qE ' U __asan_'; then
            echo "::error::$so has no references to ASAN runtime symbols"
            exit 1
          fi
          echo "ASAN runtime linked and referenced: ok"

      - name: Build ABI driver with ASAN
        run: >
          cc -std=c11 -Wall -Wextra -Werror -g -fsanitize=address -pthread
          tools/ffi-abi-driver/ffi_abi_driver.c -o ffi_abi_driver -ldl

      - name: Run symbols scenario
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
        run: ./ffi_abi_driver rust/target/asan/x86_64-unknown-linux-gnu/debug/libpdfoxide_bindings.so symbols

      - name: Run smoke scenario
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
        run: ./ffi_abi_driver rust/target/asan/x86_64-unknown-linux-gnu/debug/libpdfoxide_bindings.so smoke

      - name: Run null-path scenario
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
        run: ./ffi_abi_driver rust/target/asan/x86_64-unknown-linux-gnu/debug/libpdfoxide_bindings.so null-path

      - name: Run threads scenario
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
        run: ./ffi_abi_driver rust/target/asan/x86_64-unknown-linux-gnu/debug/libpdfoxide_bindings.so threads

  tsan:
    name: TSan ABI driver
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # TSan needs an instrumented std; without `-Zbuild-std` the precompiled
      # std is uninstrumented and TSan reports spurious races in std internals.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: sanitizers-tsan

      - name: Build ThreadSanitizer native library
        env:
          CARGO_TARGET_DIR: rust/target/tsan
        run: >
          cargo +nightly build --manifest-path rust/Cargo.toml
          --target x86_64-unknown-linux-gnu
          -Zbuild-std
          --config "target.x86_64-unknown-linux-gnu.rustflags=['-Zsanitizer=thread']"

      - name: Verify the library is TSan-instrumented
        run: |
          set -euo pipefail
          so=rust/target/tsan/x86_64-unknown-linux-gnu/debug/libpdfoxide_bindings.so
          test -f "$so"
          if ! readelf -d "$so" | grep -qE 'NEEDED.*libtsan'; then
            echo "::error::$so does not link the TSan runtime"
            readelf -d "$so"
            exit 1
          fi
          if ! nm -D "$so" | grep -qE ' U __tsan_'; then
            echo "::error::$so has no references to TSan runtime symbols"
            exit 1
          fi
          echo "TSan runtime linked and referenced: ok"

      - name: Build ABI driver with TSan
        run: >
          cc -std=c11 -Wall -Wextra -Werror -g -fsanitize=thread -pthread
          tools/ffi-abi-driver/ffi_abi_driver.c -o ffi_abi_driver_tsan -ldl

      - name: Run threads scenario
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ./ffi_abi_driver_tsan rust/target/tsan/x86_64-unknown-linux-gnu/debug/libpdfoxide_bindings.so threads

  pageheap:
    name: Windows PageHeap crash host
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build native library
        run: cargo build --release --locked --manifest-path rust/Cargo.toml

      - name: Copy native library into runtimes
        shell: pwsh
        run: Copy-Item rust/target/release/pdfoxide_bindings.dll runtimes/win-x64/native/pdfoxide_bindings.dll -Force

      - name: Publish crash host apphost
        run: >
          dotnet publish csharp/FfiCrashHost/FfiCrashHost.csproj
          --configuration Release --runtime win-x64 --self-contained false
          -p:UseAppHost=true -o publish

      - name: Copy native library next to the host
        shell: pwsh
        run: Copy-Item runtimes/win-x64/native/pdfoxide_bindings.dll publish/pdfoxide_bindings.dll -Force

      - name: Enable PageHeap
        shell: pwsh
        run: |
          $gflags = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers\*\x64\gflags.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $gflags) { throw 'gflags.exe not found; PageHeap is unavailable on this runner.' }
          & $gflags.FullName /p /enable "$PWD\publish\FfiCrashHost.exe" /full

      - name: Run safe scenarios under PageHeap
        shell: pwsh
        run: |
          $exe = "$PWD\publish\FfiCrashHost.exe"
          $scenarios = @(
            'noop',
            'null-path-extract',
            'reuse-after-save',
            'builder-extension-validation',
            'streaming-state-machine',
            'editor-error-code-contract',
            'editor-page-edit-extremes'
          )
          foreach ($scenario in $scenarios) {
            & $exe $scenario
            if ($LASTEXITCODE -ne 0) { throw "scenario failed: $scenario ($LASTEXITCODE)" }
          }

      - name: Disable PageHeap
        if: always()
        shell: pwsh
        run: |
          $gflags = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers\*\x64\gflags.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($gflags) {
            & $gflags.FullName /p /disable "$PWD\publish\FfiCrashHost.exe"
          }
