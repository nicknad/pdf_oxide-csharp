[package]
name = "pdf_oxide_ffi"
version = "0.1.0"
edition = "2024"

[lib]
name = "pdfoxide_bindings"
crate-type = ["cdylib", "rlib"]

[features]
# Enables test-only FFI hooks (see src/test_hooks.rs). Never enable in a shipped build.
ffi-test-hooks = []

[dependencies]
base64 = "0.23"
pdf_oxide = { version = "0.3.78", features = ["signatures", "tsa-client", "barcodes"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
csbindgen = "1.9.8"
